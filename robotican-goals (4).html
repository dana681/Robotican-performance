<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robotican | מערכת ביצועים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --surface2: #1e2433;
    --border: #2a3147;
    --accent: #E8520A;
    --accent2: #f97316;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at 60% 40%, #3d1a08 0%, #0d0f14 70%);
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 380px;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }

  .login-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .login-title {
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .login-sub {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 36px;
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: 'Heebo', sans-serif;
    color: var(--text);
    direction: rtl;
    transition: border-color 0.2s;
    outline: none;
  }

  .field input:focus, .field select:focus, .field textarea:focus {
    border-color: var(--accent);
  }

  .field textarea { resize: vertical; min-height: 80px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .btn-primary {
    background: #E8520A;
    color: #fff;
    width: 100%;
    justify-content: center;
    padding: 13px;
    font-size: 15px;
  }
  .btn-primary:hover { background: #2563eb; }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-ghost {
    background: transparent;
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
  .btn-danger:hover { background: #991b1b; }

  .btn-sm { padding: 7px 13px; font-size: 13px; }

  /* ── MAIN LAYOUT ── */
  #app { display: none; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text2);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .role-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .role-manager { background: #3d1a08; color: #f97316; }
  .role-employee { background: #14532d; color: #86efac; }
  .role-hr { background: #3b0764; color: #d8b4fe; }

  main { padding: 32px; max-width: 1100px; margin: 0 auto; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px;
    margin-bottom: 28px;
    width: fit-content;
  }

  .tab {
    padding: 8px 20px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text2);
    border: none;
    background: transparent;
    font-family: 'Heebo', sans-serif;
    transition: all 0.15s;
  }

  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  .tab:not(.active):hover { color: var(--text); background: var(--surface2); }

  /* ── SECTION HEADER ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-title {
    font-size: 20px;
    font-weight: 700;
  }

  .section-sub {
    font-size: 13px;
    color: var(--text2);
    margin-top: 2px;
  }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .card:hover { border-color: #3a4560; }

  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }

  .card-title {
    font-size: 16px;
    font-weight: 700;
  }

  .card-meta {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 5px;
  }

  .meta-item {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ── STATUS BADGES ── */
  .status-badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .status-not-started { background: #1e293b; color: var(--text2); }
  .status-in-progress { background: #3d1a08; color: #f97316; }
  .status-done { background: #14532d; color: #86efac; }
  .status-late { background: #450a0a; color: #fca5a5; }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    margin: 12px 0;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 6px;
  }

  .progress-track {
    height: 8px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease;
    background: var(--accent);
  }

  .progress-fill.done { background: var(--green); }
  .progress-fill.mid { background: var(--yellow); }
  .progress-fill.low { background: var(--text3); }

  /* ── COMMENTS ── */
  .comments-section {
    border-top: 1px solid var(--border);
    margin-top: 14px;
    padding-top: 14px;
  }

  .comment-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .comment-author {
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 3px;
  }

  .comment-time {
    font-size: 11px;
    color: var(--text3);
  }

  /* ── MODAL ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 40px 120px rgba(0,0,0,0.6);
  }

  .modal-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 24px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
    flex-wrap: wrap;
  }

  /* ── EMPLOYEE SELECTOR ── */
  .employee-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
  }

  .emp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .emp-row:hover { border-color: var(--accent); }
  .emp-row.selected { border-color: var(--accent); background: #1e3a5f22; }

  .emp-avatar {
    width: 34px;
    height: 34px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #fff;
    flex-shrink: 0;
  }

  .emp-info { flex: 1; margin-right: 12px; }
  .emp-name { font-size: 14px; font-weight: 600; }
  .emp-dept { font-size: 12px; color: var(--text2); }

  /* ── STATS ── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
  }

  .stat-num {
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text2);
    margin-top: 6px;
  }

  /* ── EMPTY ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }

  .empty-icon { font-size: 48px; margin-bottom: 14px; }
  .empty-text { font-size: 16px; font-weight: 600; color: var(--text2); }
  .empty-sub { font-size: 13px; margin-top: 6px; }

  /* ── INLINE EDIT ── */
  .edit-progress-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 10px;
  }

  .edit-progress-row input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }

  .pct-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
    min-width: 36px;
    text-align: center;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Heebo', sans-serif;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    transition: all 0.15s;
  }

  .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filter-btn:not(.active):hover { border-color: var(--accent); color: var(--text); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 24px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 600;
    z-index: 9999;
    transition: transform 0.3s ease;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  .app-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 5px;
    width: fit-content;
  }
  .app-tab {
    padding: 9px 24px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: var(--text2);
    border: none;
    background: transparent;
    font-family: 'Heebo', sans-serif;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  .app-tab.active { background: var(--accent); color: #fff; }
  .app-tab:not(.active):hover { color: var(--text); background: var(--surface2); }

  /* eval form */
  .eval-section { margin-bottom: 28px; }
  .eval-section-title {
    font-size: 13px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .rating-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--bg); border-radius: 8px;
    margin-bottom: 6px; gap: 16px;
  }
  .rating-label { font-size: 14px; font-weight: 500; flex: 1; }
  .rating-label small { display: block; font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 400; }
  .rating-stars { display: flex; gap: 6px; flex-shrink: 0; }
  .star-btn {
    width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: 'Heebo', sans-serif; transition: all 0.12s;
    display: flex; align-items: center; justify-content: center;
  }
  .star-btn:hover { border-color: var(--accent); color: var(--accent); }
  .star-btn.sel-1 { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }
  .star-btn.sel-2 { background: #78350f; color: #fcd34d; border-color: #92400e; }
  .star-btn.sel-3 { background: #14532d; color: #86efac; border-color: #166534; }
  .star-btn.sel-4 { background: #1e3a5f; color: #93c5fd; border-color: #1d4ed8; }

  .eval-status-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .eval-not-started { background: #1e293b; color: var(--text2); }
  .eval-self-done { background: #78350f; color: #fcd34d; }
  .eval-manager-done { background: #1e3a5f; color: #93c5fd; }
  .eval-complete { background: #14532d; color: #86efac; }

  .employee-eval-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; cursor: pointer; transition: border-color 0.15s;
  }
  .employee-eval-card:hover { border-color: var(--accent); }

  .eval-progress-mini {
    display: flex; gap: 6px; align-items: center;
  }
  .eval-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--border);
  }
  .eval-dot.done { background: var(--green); }
  .eval-dot.partial { background: var(--yellow); }

  .form-step { display: none; }
  .form-step.active { display: block; }

  .step-indicator {
    display: flex; gap: 8px; margin-bottom: 24px; align-items: center;
  }
  .step-dot {
    width: 28px; height: 28px; border-radius: 50%; background: var(--surface2);
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700; color: var(--text3);
    flex-shrink: 0;
  }
  .step-dot.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .step-dot.done { background: var(--green); color: #fff; border-color: var(--green); }
  .step-line { flex: 1; height: 1px; background: var(--border); }

  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    color: var(--text2); cursor: pointer; margin-bottom: 20px; background: none;
    border: none; font-family: 'Heebo', sans-serif; padding: 0;
  }
  .back-btn:hover { color: var(--text); }

  .summary-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .summary-score {
    font-weight: 700; padding: 2px 10px; border-radius: 20px;
    font-size: 12px;
  }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div style="margin-bottom:20px;">
      <div dir="ltr" style="display:flex;align-items:center;gap:0;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:36px;color:#fff;letter-spacing:-1px;line-height:1;">
        <span>ROBOT</span>
        <span style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#E8520A;width:30px;height:44px;border-radius:5px;margin:0 2px;flex-shrink:0;">
          <span style="display:flex;gap:7px;margin-bottom:6px;">
            <span style="width:6px;height:6px;background:#fff;border-radius:50%;display:block;"></span>
            <span style="width:6px;height:6px;background:#fff;border-radius:50%;display:block;"></span>
          </span>
          <span style="width:6px;height:16px;background:#fff;border-radius:2px;display:block;"></span>
        </span>
        <span>CAN</span>
      </div>
      <div style="font-family:Arial,sans-serif;font-weight:300;font-size:11px;color:#666;letter-spacing:5px;margin-top:6px;">AUTONOMOUS ROBOTICS</div>
    </div>
    <div class="login-title">מערכת ביצועים H2/26</div>
    <div class="login-sub">הזינו את כתובת האימייל שלכם להתחברות</div>

    <div class="field">
      <label>אימייל</label>
      <input type="email" id="login-email" placeholder="yourname@robotican.com" />
    </div>

    <button class="btn btn-primary" onclick="doLogin()">כניסה למערכת</button>

    <div id="login-error" style="color:#f87171;font-size:13px;margin-top:12px;display:none;">
      כתובת אימייל לא מוכרת במערכת
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <div dir="ltr" style="display:flex;align-items:center;gap:0;font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:22px;color:#fff;letter-spacing:-0.5px;line-height:1;">
        <span>ROBOT</span>
        <span style="display:inline-flex;flex-direction:column;align-items:center;justify-content:center;background:#E8520A;width:20px;height:28px;border-radius:3px;margin:0 2px;flex-shrink:0;">
          <span style="display:flex;gap:4px;margin-bottom:4px;">
            <span style="width:4px;height:4px;background:#fff;border-radius:50%;display:block;"></span>
            <span style="width:4px;height:4px;background:#fff;border-radius:50%;display:block;"></span>
          </span>
          <span style="width:4px;height:10px;background:#fff;border-radius:2px;display:block;"></span>
        </span>
        <span>CAN</span>
      </div>
      <div class="header-title">מערכת ביצועים H2 2026</div>
    </div>
    <div class="user-badge">
      <span id="header-name"></span>
      <span id="header-role" class="role-tag"></span>
      <button class="btn btn-ghost btn-sm" onclick="logout()">יציאה</button>
    </div>
  </header>

  <main>
    <div class="app-tabs" id="app-tabs">
      <button class="app-tab active" id="tab-goals" onclick="switchTab('goals')">🎯 יעדים</button>
      <button class="app-tab" id="tab-evals" onclick="switchTab('evals')">📋 הערכות</button>
    </div>
    <div id="view-manager"></div>
    <div id="view-employee"></div>
    <div id="view-evals" style="display:none;"></div>
  </main>
</div>

<!-- MODAL: Add/Edit Goal -->
<div class="overlay" id="modal-goal">
  <div class="modal">
    <div class="modal-title" id="modal-goal-title">הוספת יעד</div>

    <div class="field">
      <label>עובד</label>
      <select id="goal-employee-select"></select>
    </div>

    <div class="field">
      <label>תיאור היעד</label>

const SHEETS_API = "https://script.google.com/a/macros/robotican.net/s/AKfycbzjWN0_Hf5MpJK-09NBXM-XRYwBB5yuzNnsEjv-_A1tSHWX6i79Nzy0aLz1Xc7AkzKQ/exec";

async function storageGet(key) {
  try {
    const res = await fetch(SHEETS_API + '?action=get&key=' + encodeURIComponent(key));
    const data = await res.json();
    return data.value ? { value: data.value } : null;
  } catch(e) { return null; }
}

async function storageSet(key, value) {
  try {
    const res = await fetch(SHEETS_API, {
      method: 'POST',
      body: JSON.stringify({ action: 'set', key, value: JSON.stringify(value) })
    });
    return await res.json();
  } catch(e) { return null; }
}

async function loadGoals() {
  const r = await storageGet('goals');
  if (!r) return [];
  try { return JSON.parse(r.value); } catch(e) { return []; }
}

async function saveGoals(goals) {
  await storageSet('goals', goals);
}

// ═══════════════════════════════
//  GOAL CARD
// ═══════════════════════════════

function getStatusLabel(status) {
  const map = { 'not-started': 'לא התחיל', 'in-progress': 'בתהליך', 'done': 'הושלם' };
  return map[status] || status;
}

function getStatusClass(status) {
  const map = { 'not-started': 'status-not-started', 'in-progress': 'status-in-progress', 'done': 'status-done' };
  return map[status] || '';
}

function getProgressClass(pct) {
  if (pct >= 100) return 'done';
  if (pct >= 50) return '';
  return 'low';
}

function isLate(g) {
  if (!g.dueDate || g.status === 'done') return false;
  return new Date(g.dueDate) < new Date();
}

function renderGoalCard(g, isManager) {
  const late = isLate(g);
  const statusClass = late ? 'status-late' : getStatusClass(g.status);
  const statusLabel = late ? 'באיחור' : getStatusLabel(g.status);
  const pct = g.progress || 0;
  const fillClass = getProgressClass(pct);
  const canEdit = isManager;
  const canUpdate = !isManager || currentUser.role === 'hr';

  const comments = g.comments || [];
  const commentsHtml = comments.length > 0
    ? `<div class="comments-section">
        <div style="font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;">הערות ועדכונים</div>
        ${comments.map(c => `
          <div class="comment-item">
            <div class="comment-author">${c.author} <span class="comment-time">· ${c.date}</span></div>
            <div>${c.text}</div>
          </div>`).join('')}
       </div>`
    : '';

  return `
    <div class="card" id="card-${g.id}">
      <div class="card-header">
        <div style="flex:1">
          <div class="card-title">${g.desc}</div>
          <div class="card-meta">
            <span class="status-badge ${statusClass}">${statusLabel}</span>
            ${g.dueDate ? `<span class="meta-item">📅 ${g.dueDate}</span>` : ''}
            ${g.kpi ? `<span class="meta-item">🎯 ${g.kpi}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0">
          ${canUpdate ? `<button class="btn btn-secondary btn-sm" onclick="openProgress('${g.id}')">עדכון</button>` : ''}
          ${canEdit ? `<button class="btn btn-ghost btn-sm" onclick="openEditGoal('${g.id}')">✏️</button>` : ''}
          ${canEdit ? `<button class="btn btn-danger btn-sm" onclick="deleteGoal('${g.id}')">✕</button>` : ''}
        </div>
      </div>

      <div class="progress-wrap">
        <div class="progress-info">
          <span>התקדמות</span>
          <span style="font-weight:700;color:var(--accent2)">${pct}%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill ${fillClass}" style="width:${pct}%"></div>
        </div>
      </div>

      ${commentsHtml}
    </div>`;
}

function openEditGoal(id) {
  const g = goals.find(x => x.id === id);
  if (!g) return;
  editingGoalId = id;
  document.getElementById('modal-goal-title').textContent = 'עריכת יעד';
  document.getElementById('goal-desc').value = g.desc;
  document.getElementById('goal-kpi').value = g.kpi || '';
  document.getElementById('goal-date').value = g.dueDate || '';

  const emp = USERS.find(u => u.email === g.employeeEmail);
  const sel = document.getElementById('goal-employee-select');
  sel.innerHTML = `<option value="${g.employeeEmail}">${emp ? emp.name : g.employeeEmail}</option>`;
  sel.disabled = true;
  openModal('modal-goal');
}

async function saveGoal() {
  const desc = document.getElementById('goal-desc').value.trim();
  if (!desc) { showToast('נא למלא תיאור יעד'); return; }

  if (editingGoalId) {
    const g = goals.find(x => x.id === editingGoalId);
    g.desc = desc;
    g.kpi = document.getElementById('goal-kpi').value.trim();
    g.dueDate = document.getElementById('goal-date').value;
  } else {
    const email = document.getElementById('goal-employee-select').value;
    goals.push({
      id: 'g' + Date.now(),
      employeeEmail: email,
      desc,
      kpi: document.getElementById('goal-kpi').value.trim(),
      dueDate: document.getElementById('goal-date').value,
      status: 'not-started',
      progress: 0,
      comments: [],
      createdBy: currentUser.email,
      createdAt: new Date().toLocaleDateString('he-IL'),
    });
  }

  await saveGoals(goals);
  closeModal('modal-goal');
  showToast('היעד נשמר בהצלחה ✓');
  renderCurrentView();
}

function openProgress(id) {
  progressGoalId = id;
  const g = goals.find(x => x.id === id);
  if (!g) return;

  document.getElementById('progress-goal-info').innerHTML = `
    <strong>${g.desc}</strong><br>
    <span style="color:var(--text2);font-size:12px;">${g.kpi || ''}</span>`;

  document.getElementById('progress-slider').value = g.progress || 0;
  document.getElementById('slider-label').textContent = (g.progress || 0) + '%';
  document.getElementById('progress-comment').value = '';
  document.getElementById('progress-done').checked = g.status === 'done';
  openModal('modal-progress');
}

function updateSliderLabel(v) {
  document.getElementById('slider-label').textContent = v + '%';
}

async function saveProgress() {
  const g = goals.find(x => x.id === progressGoalId);
  if (!g) return;

  const pct = parseInt(document.getElementById('progress-slider').value);
  const comment = document.getElementById('progress-comment').value.trim();
  const isDone = document.getElementById('progress-done').checked;

  g.progress = pct;
  g.status = isDone ? 'done' : pct > 0 ? 'in-progress' : 'not-started';

  if (comment) {
    if (!g.comments) g.comments = [];
    g.comments.push({
      author: currentUser.name,
      text: comment,
      date: new Date().toLocaleDateString('he-IL'),
    });
  }

  await saveGoals(goals);
  closeModal('modal-progress');
  showToast('ההתקדמות עודכנה ✓');
  renderCurrentView();
}

async function deleteGoal(id) {
  if (!confirm('למחוק את היעד?')) return;
  goals = goals.filter(g => g.id !== id);
  await saveGoals(goals);
  showToast('היעד נמחק');
  renderCurrentView();
}

function renderCurrentView() {
  if (currentUser.role === 'employee') renderEmployeeView();
  else renderManagerView();
}

// ── Helpers ──
function getEval(employeeEmail, type) {
  return evaluations.find(e => e.employeeEmail === employeeEmail && e.type === type && e.period === EVAL_PERIOD);
}

function evalStatusLabel(emp) {
  const self = getEval(emp.email, 'self');
  const mgr = getEval(emp.email, 'manager');
  if (self && mgr) return { label: 'הושלם', cls: 'eval-complete' };
  if (mgr) return { label: 'הערכת מנהל הושלמה', cls: 'eval-manager-done' };
  if (self) return { label: 'הערכה עצמית הושלמה', cls: 'eval-self-done' };
  return { label: 'טרם מולא', cls: 'eval-not-started' };
}

function scoreColor(s) {
  if (!s) return '';
  if (s <= 1) return 'background:#7f1d1d;color:#fca5a5';
  if (s <= 2) return 'background:#78350f;color:#fcd34d';
  if (s <= 3) return 'background:#14532d;color:#86efac';
  return 'background:#1e3a5f;color:#93c5fd';
}

function scoreLabel(s) {
  const m = { 1:'טעון שיפור', 2:'בינוני', 3:'טוב', 4:'מעולה' };
  return m[s] || '';
}

function avgScore(obj, keys) {
  const vals = keys.map(k => obj[k]).filter(v => v);
  if (!vals.length) return null;
  return (vals.reduce((a,b) => a+b, 0) / vals.length).toFixed(1);
}

function renderCompactEvalSummary(ev, type) {
  const profKeys = type === 'self' ? SELF_PROF.map(q=>q.id) : MGR_PROF.map(q=>q.id);
  const profAvg = avgScore(ev.ratings, profKeys);
  const sections = type === 'self'
    ? [['הערכה מקצועית', profAvg], ['פיתוח וסביבה', avgScore(ev.ratings, SELF_DEV.map(q=>q.id))], ['תרבות ארגונית', avgScore(ev.ratings, SELF_CULTURE.map(q=>q.id))]]
    : [['מקצועי', profAvg], ['אישי/חברתי', avgScore(ev.ratings, MGR_PERSONAL.map(q=>q.id))], ['לקוחות', avgScore(ev.ratings, MGR_CUSTOMER.map(q=>q.id))]];

  return sections.map(([label, score]) => `
    <div class="summary-row">
      <span style="font-size:13px;">${label}</span>
      ${score ? `<span class="summary-score" style="${scoreColor(parseFloat(score))}">${score} · ${scoreLabel(Math.round(parseFloat(score)))}</span>` : '<span style="color:var(--text3);font-size:12px;">—</span>'}
    </div>`).join('') +
    (ev.text?.ceo ? `<div style="margin-top:12px;font-size:12px;color:var(--text2);"><strong>שולחן המנכ"ל:</strong> ${ev.text.ceo}</div>` : '');
}

    ['איכות תוצרים', 'sp8', 'mp4'],
    ['יצירתיות', 'sp9', 'mp5'],
    ['פתיחות למשוב', 'sp10', 'mp6'],
  ];
  return `
    <div class="card" style="margin-top:16px;">
      <div class="eval-section-title">השוואה: עצמי מול מנהל</div>
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;font-size:11px;color:var(--text3);padding:0 4px;margin-bottom:8px;">
        <div>תחום</div><div style="text-align:center;">עצמי</div><div style="text-align:center;">מנהל</div><div style="text-align:center;">פער</div>
      </div>
      ${pairs.map(([label, sk, mk]) => {
        const sv = self.ratings[sk];
        const mv = mgr.ratings[mk];
        const diff = sv && mv ? sv - mv : null;
        return `
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--border);">
          <div style="font-size:13px;">${label}</div>
          <div style="text-align:center;">${sv ? `<span class="summary-score" style="${scoreColor(sv)}">${sv}</span>` : '—'}</div>
          <div style="text-align:center;">${mv ? `<span class="summary-score" style="${scoreColor(mv)}">${mv}</span>` : '—'}</div>
          <div style="text-align:center;font-weight:700;color:${diff===null?'var(--text3)':diff>0?'var(--yellow)':diff<0?'var(--accent2)':'var(--green)'};">
            ${diff === null ? '—' : diff > 0 ? '+'+diff : diff}
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ═══════════════════════════════

let selfEvalStep = 1;

function renderSelfEvalForm() {

function renderSelfStep() {
  const el = document.getElementById('self-form-content');

      <div class="card">

        ${SELF_PROF.map(q => renderRatingRow(q, 'self')).join('')}

          <label>פירוט על ציונים נמוכים (אופציונלי)</label>
          <textarea id="text-prof-detail" placeholder="פרט/י על היגדים שסימנת כבינוני או טעון שיפור...">${evalFormData.text?.profDetail||''}</textarea>
        </div>
      </div>
      ${stepNav(1)}`;
  } else if (selfEvalStep === 2) {
    el.innerHTML = `
      <div class="card">
        <div class="eval-section-title">פיתוח אישי וסביבת עבודה</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">1=לא מסכים/ה כלל | 2=לא מסכים/ה | 3=מסכים/ה | 4=מסכים/ה מאוד</div>
        ${SELF_DEV.map(q => renderRatingRow(q, 'self')).join('')}
        <div style="margin-top:16px;" class="field">
          <label>פירוט על ציונים נמוכים (אופציונלי)</label>
          <textarea id="text-dev-detail" placeholder="פרט/י...">${evalFormData.text?.devDetail||''}</textarea>
        </div>
      </div>
      ${stepNav(2)}`;
  } else if (selfEvalStep === 3) {
    el.innerHTML = `
      <div class="card">
        <div class="eval-section-title">תרבות ארגונית ושביעות רצון</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">1=לא מסכים/ה כלל | 2=לא מסכים/ה | 3=מסכים/ה | 4=מסכים/ה מאוד</div>
        ${SELF_CULTURE.map(q => renderRatingRow(q, 'self')).join('')}
        <div style="margin-top:16px;" class="field">
          <label>פירוט על ציונים נמוכים (אופציונלי)</label>
          <textarea id="text-culture-detail" placeholder="פרט/י...">${evalFormData.text?.cultureDetail||''}</textarea>
        </div>
      </div>
      ${stepNav(3)}`;
  } else if (selfEvalStep === 4) {
    el.innerHTML = `
      <div class="card">
        <div class="eval-section-title">🚀 שולחן המנכ"ל — רעיונות לשיפור</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:16px;">אילו היית מנכ"ל רובוטיכאן — אילו 3 שינויים או שיפורים היית מיישם כדי לעזור לחברה להתקדם? חשוב/י בגדול ובאומץ!</div>
        <div class="field">
          <textarea id="text-ceo" rows="5" placeholder="1. &#10;2. &#10;3.">${evalFormData.text?.ceo||''}</textarea>
        </div>
      </div>
      <div class="card" style="margin-top:16px;">
        <div class="eval-section-title">סיכום הערכה</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px;">לפני שליחה — בדוק/י את הציונים הממוצעים שלך:</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
          <div class="stat-card"><div class="stat-num" style="font-size:22px;color:var(--accent2)">${avgScore(evalFormData.ratings,SELF_PROF.map(q=>q.id))||'—'}</div><div class="stat-label">מקצועי</div></div>
          <div class="stat-card"><div class="stat-num" style="font-size:22px;color:var(--accent2)">${avgScore(evalFormData.ratings,SELF_DEV.map(q=>q.id))||'—'}</div><div class="stat-label">פיתוח</div></div>
          <div class="stat-card"><div class="stat-num" style="font-size:22px;color:var(--accent2)">${avgScore(evalFormData.ratings,SELF_CULTURE.map(q=>q.id))||'—'}</div><div class="stat-label">תרבות</div></div>
        </div>
      </div>
      ${stepNav(4)}`;
  }

  // Restore ratings UI
  restoreRatingSelections();
}

function renderRatingRow(q, formType) {
  return `
    <div class="rating-row">
      <div class="rating-label">${q.label}${q.sub?`<small>${q.sub}</small>`:''}</div>
      <div class="rating-stars" id="stars-${q.id}">
        ${[1,2,3,4].map(v => `<button class="star-btn" onclick="setRating('${q.id}',${v})">${v}</button>`).join('')}
      </div>
    </div>`;
}

function restoreRatingSelections() {
  Object.entries(evalFormData.ratings||{}).forEach(([qid, val]) => {
    highlightStars(qid, val);
  });
}

function setRating(qid, val) {
  if (!evalFormData.ratings) evalFormData.ratings = {};
  evalFormData.ratings[qid] = val;
  highlightStars(qid, val);
}

function highlightStars(qid, val) {
  const container = document.getElementById('stars-'+qid);
  if (!container) return;
  container.querySelectorAll('.star-btn').forEach((btn,i) => {
    btn.className = 'star-btn' + (i+1 === val ? ' sel-'+val : '');
  });
}

function stepNav(step) {
  return `
    <div style="display:flex;justify-content:space-between;margin-top:20px;">
      ${step > 1 ? `<button class="btn btn-ghost" onclick="selfStep(${step-1})">→ הקודם</button>` : '<div></div>'}
      ${step < SELF_TOTAL_STEPS
        ? `<button class="btn btn-primary" onclick="selfStep(${step+1})">הבא ←</button>`
        : `<button class="btn btn-primary" onclick="submitSelfEval()">שלח הערכה ✓</button>`}
    </div>`;
}

function selfStep(step) {
  // Save current step text fields
  saveCurrentStepText();
  selfEvalStep = step;
  renderSelfEvalForm();
}

function saveCurrentStepText() {
  if (!evalFormData.text) evalFormData.text = {};
  const fields = {
    'text-prof-detail': 'profDetail',
    'text-dev-detail': 'devDetail',
    'text-culture-detail': 'cultureDetail',
    'text-goals-prev': 'goalsPrev',
    'text-goals-prof': 'goalsProf',
    'text-goals-personal': 'goalsPersonal',
    'text-ceo': 'ceo',
  };
  Object.entries(fields).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) evalFormData.text[key] = el.value;
  });
}

async function submitSelfEval() {
  saveCurrentStepText();
  evalFormData.submittedAt = new Date().toLocaleDateString('he-IL');

  evaluations = evaluations.filter(e => !(e.employeeEmail === currentUser.email && e.type === 'self' && e.period === EVAL_PERIOD));
  evaluations.push(evalFormData);
  await saveEvals(evaluations);
  showToast('הערכה עצמית הוגשה בהצלחה ✓');
  renderEvalsView();
}

  } else if (mgrEvalStep === 2) {
    el.innerHTML = `
      <div class="card">
        <div class="eval-section-title">כישורים אישיים וחברתיים</div>
        <div style="font-size:12px;color:var(--text3);margin-bottom:16px;">1=טעון שיפור | 2=בינוני | 3=טוב | 4=מעולה</div>
        ${MGR_PERSONAL.map(q => renderRatingRow(q, 'manager')).join('')}
        <div style="margin-top:16px;"><div class="eval-section-title">עבודה עם לקוחות/ספקים <span style="font-weight:400;font-size:11px;color:var(--text3);">(אם רלוונטי)</span></div></div>
        ${MGR_CUSTOMER.map(q => renderRatingRow(q, 'manager')).join('')}
        <div style="margin-top:16px;" class="field">
          <label>פירוט על ציונים נמוכים (אופציונלי)</label>
          <textarea id="mgr-personal-detail" placeholder="פרט/י...">${evalFormData.text?.personalDetail||''}</textarea>
        </div>
      </div>
      ${mgrStepNav(2)}`;
  } else if (mgrEvalStep === 3) {
    el.innerHTML = `
      <div class="card">
        <div class="eval-section-title">יעדי-על למחצית הבאה</div>

function mgrStepNav(step) {
  return `
    <div style="display:flex;justify-content:space-between;margin-top:20px;">
      ${step > 1 ? `<button class="btn btn-ghost" onclick="mgrStep(${step-1})">→ הקודם</button>` : '<div></div>'}

    </div>`;
}

function mgrStep(step) {
  saveMgrStepText();
  mgrEvalStep = step;
  renderManagerEvalForm();
}

function saveMgrStepText() {
  if (!evalFormData.text) evalFormData.text = {};
  const fields = {
    'mgr-responsibilities':'responsibilities','mgr-prof-detail':'profDetail',
    'mgr-personal-detail':'personalDetail',
    'mgr-goal-prof-desc':'goalProfDesc','mgr-goal-prof-kpi':'goalProfKpi',
    'mgr-goal-prof-result':'goalProfResult','mgr-goal-prof-pct':'goalProfPct',
    'mgr-goal-prof-rating':'goalProfRating',
    'mgr-goal-personal-desc':'goalPersonalDesc','mgr-goal-personal-kpi':'goalPersonalKpi',
    'mgr-goal-personal-result':'goalPersonalResult','mgr-goal-personal-pct':'goalPersonalPct',
    'mgr-goal-personal-rating':'goalPersonalRating',
    'mgr-next-prof':'nextProf','mgr-next-personal':'nextPersonal',
  };
  Object.entries(fields).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) evalFormData.text[key] = el.value;
  });
}

async function submitManagerEval() {
  saveMgrStepText();
  evalFormData.submittedAt = new Date().toLocaleDateString('he-IL');
  evaluations = evaluations.filter(e => !(e.employeeEmail === mgrEvalEmail && e.type === 'manager' && e.period === EVAL_PERIOD));
  evaluations.push(evalFormData);
  await saveEvals(evaluations);
  showToast('הערכת מנהל הוגשה בהצלחה ✓');
  openEmpEvalDetail(mgrEvalEmail);
}
